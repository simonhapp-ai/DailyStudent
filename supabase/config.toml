
[functions.groq-proxy]
enabled = true
verify_jwt = false
import_map = "./functions/groq-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/groq-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/groq-proxy/*.html" ]

[functions.gemini-proxy]
enabled = true
verify_jwt = false
import_map = "./functions/gemini-proxy/deno.json"
entrypoint = "./functions/gemini-proxy/index.ts"

[functions.create-checkout-session]
enabled = true
verify_jwt = true
entrypoint = "./functions/create-checkout-session/index.ts"

[functions.stripe-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/stripe-webhook/index.ts"

# RevenueCat posts its own shared-secret Authorization header, not a Supabase
# JWT — verify_jwt must be false or the platform rejects every webhook call
# before the handler runs (same as stripe-webhook).
[functions.revenuecat-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/revenuecat-webhook/index.ts"
